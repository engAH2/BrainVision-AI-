<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainVision AI – Interactive Project Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16122e; --ink2:#2b2650; --dark:#1b1440; --vio:#5b3fb8; --vio2:#7c63d6; --lav:#efebfb; --lav2:#e2dbfa;
  --org:#e8691c; --org2:#ff9b5c; --peach:#fdeee3; --ok:#14966f; --bad:#d6334a; --bg:#f7f5fd; --card:#fff;
  --r:18px; --shadow:0 10px 30px -12px rgba(42,31,94,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
h1,h2,h3{line-height:1.2;margin:0}
.en-num,.mono{font-family:"Space Grotesk","IBM Plex Sans Arabic",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
button{font:inherit;cursor:pointer}
/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(27,20,64,.92);backdrop-filter:blur(10px);color:#fff}
nav .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-family:"Space Grotesk";font-size:19px;letter-spacing:.3px}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--vio2),var(--org));display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid #fff}
nav .links{display:flex;gap:4px;margin-inline-start:auto}
nav .links a{color:#e4ddfb;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:10px}
nav .links a:hover{background:rgba(255,255,255,.1);color:#fff}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px}
.lang button.on{background:#fff;color:var(--dark)}
/* hero */
.hero{background:radial-gradient(1200px 500px at 85% -10%,rgba(124,99,214,.55),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(232,105,28,.35),transparent 60%),var(--dark);color:#fff;padding:70px 0 90px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.tag{display:inline-block;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--org2);margin-bottom:14px}
[dir=rtl] .tag{letter-spacing:0}
.hero h1{font-size:54px;font-family:"Space Grotesk","IBM Plex Sans Arabic";font-weight:700}
.hero p.lead{font-size:19px;color:#ddd5fb;max-width:560px;margin:16px 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--org);color:#fff;box-shadow:0 10px 24px -10px var(--org)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.vio{background:var(--vio);color:#fff}
.btn.light{background:var(--lav);color:var(--vio)}
.btn.danger{background:#fde8eb;color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px;max-width:560px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:"Space Grotesk";font-size:24px}
.stat span{font-size:12.5px;color:#cfc6f6}
.brainart{position:relative;aspect-ratio:1;border-radius:28px;background:#000;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.brainart canvas{width:100%;height:100%;display:block}
.brainart .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--org2),transparent);box-shadow:0 0 18px var(--org2);animation:scan 3.2s ease-in-out infinite}
@keyframes scan{0%{top:6%}50%{top:92%}100%{top:6%}}
.brainart .chip{position:absolute;bottom:16px;inset-inline-start:16px;background:rgba(27,20,64,.85);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;font-size:13px}
.brainart .chip b{color:var(--org2)}
/* sections */
section{padding:72px 0}
.sh{max-width:720px;margin-bottom:30px}
.sh .tag{color:var(--org)}
.sh h2{font-size:34px;font-family:"Space Grotesk","IBM Plex Sans Arabic"}
.sh p{color:var(--ink2);margin:10px 0 0;font-size:16.5px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #ece8fa}
/* simulator */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.step{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e6e1f7;font-size:13px;font-weight:600;color:#6d6790;transition:.25s}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--lav);color:var(--vio);flex:none}
.step.on{background:var(--vio);color:#fff;border-color:var(--vio)}
.step.on i{background:#fff;color:var(--vio)}
.step.done{color:var(--vio);border-color:var(--lav2)}
.step.done i{background:var(--vio);color:#fff}
.step.err{background:#fde8eb;border-color:#f6b8c2;color:var(--bad)}
.step.err i{background:var(--bad);color:#fff}
.sim{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.panel{padding:20px}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .n{width:24px;height:24px;border-radius:8px;background:var(--org);color:#fff;display:grid;place-items:center;font-size:12.5px;font-family:"Space Grotesk"}
.samples{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sample{border:2px solid transparent;border-radius:14px;background:var(--lav);padding:6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s}
.sample canvas{width:100%;aspect-ratio:1;border-radius:10px;display:block;background:#000}
.sample:hover{border-color:var(--vio2)}
.sample.sel{border-color:var(--org);background:var(--peach)}
.uploadrow{display:flex;gap:8px;margin-top:10px}
.uploadrow label,.uploadrow button{flex:1;text-align:center;border-radius:12px;padding:10px;font-size:13px;font-weight:600;border:1.5px dashed var(--vio2);color:var(--vio);background:#fff;cursor:pointer}
.uploadrow button{border-color:#f0a3ae;color:var(--bad)}
.models{display:grid;gap:10px}
.model{display:flex;gap:12px;align-items:center;text-align:start;border:2px solid #e6e1f7;background:#fff;border-radius:14px;padding:12px}
.model b{display:block;font-size:15px}
.model small{color:#6d6790;font-size:12.5px}
.model .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--vio2);flex:none;position:relative}
.model.sel{border-color:var(--vio);background:var(--lav)}
.model.sel .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--vio)}
.divider{height:1px;background:#ece8fa;margin:18px 0}
.runrow{display:flex;gap:8px;flex-wrap:wrap}
.runrow .btn{flex:1;justify-content:center}
.stage{padding:20px;min-height:520px;display:flex;flex-direction:column}
.stagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stagehead h3{font-size:18px}
.session{font-size:12.5px;background:var(--lav);color:var(--vio);border-radius:10px;padding:6px 10px;font-weight:600}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:#7a73a0;border:2px dashed #e1dbf6;border-radius:16px;padding:30px}
.empty .big{font-size:46px}
.pre{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.pre div{text-align:center;font-size:12px;font-weight:600;color:var(--ink2);opacity:.25;transition:opacity .4s}
.pre div.show{opacity:1}
.pre canvas{width:100%;aspect-ratio:1;border-radius:10px;background:#000;display:block;margin-bottom:6px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.views figure{margin:0;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2)}
.views canvas{width:100%;aspect-ratio:1;border-radius:12px;background:#000;display:block;margin-bottom:6px}
.pred{background:var(--dark);color:#fff;border-radius:16px;padding:16px}
.pred .cls{font-size:26px;font-weight:700;font-family:"Space Grotesk","IBM Plex Sans Arabic"}
.pred .conf{color:var(--org2);font-weight:700}
.bars{margin-top:12px;display:grid;gap:8px}
.bar{font-size:13px}
.bar .t{display:flex;justify-content:space-between}
.bar .track{height:9px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;width:0;background:var(--vio2);border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.top .fill{background:var(--org)}
.notice{margin-top:14px;background:var(--peach);border:1px solid #f7cfb3;color:#8a3a0c;border-radius:14px;padding:10px 14px;font-size:13.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cmp .c{border-radius:14px;padding:12px;background:var(--lav)}
.cmp .c b{color:var(--vio)}
.cmp canvas{width:100%;aspect-ratio:1;border-radius:10px;display:block;margin:8px 0}
.err{background:#fde8eb;border:1px solid #f6b8c2;color:var(--bad);border-radius:14px;padding:16px;font-weight:600}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:#6d6790;margin-top:6px;justify-content:center}
.legend span{display:inline-block;width:120px;height:8px;border-radius:6px;background:linear-gradient(90deg,#00007f,#0050ff,#00e0ff,#7dff7a,#ffe600,#ff4c00,#7f0000)}
[dir=rtl] .legend span{transform:scaleX(-1)}
.log{margin-top:16px;background:#120d2e;color:#cfc6f6;border-radius:14px;padding:12px 14px;font-family:"Space Grotesk",monospace;font-size:12.5px;max-height:150px;overflow:auto;direction:ltr;text-align:left}
.log div{white-space:pre-wrap}
.log .m{color:var(--org2);font-weight:700}
.log .ok{color:#6ee7b7}.log .no{color:#fb7185}
.deleted{display:grid;place-items:center;text-align:center;flex:1;gap:8px}
.deleted .tick{width:70px;height:70px;border-radius:50%;background:#e3f7ef;color:var(--ok);display:grid;place-items:center;font-size:34px}
/* architecture */
.arch{padding:26px;overflow-x:auto}
.arch svg{width:100%;min-width:760px;height:auto;display:block}
.arch .node rect{rx:14}
.flowtxt{font-family:"IBM Plex Sans Arabic";font-size:14px;font-weight:600}
.pulse{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
/* pipeline + models */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:22px}
.pipe div{position:relative;background:var(--vio);color:#fff;padding:18px 18px 18px 30px;font-weight:600;font-size:14px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);min-height:84px;display:flex;align-items:center}
.pipe div:first-child{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);padding-inline-start:18px}
.pipe div:last-child{background:var(--org)}
[dir=rtl] .pipe div{clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 50%,100% 100%,18px 100%,0 50%);padding:18px 30px 18px 18px}
[dir=rtl] .pipe div:first-child{clip-path:polygon(18px 0,100% 0,100% 100%,18px 100%,0 50%)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mcard{padding:0;overflow:hidden}
.mcard .hd{padding:16px 18px;color:#fff;font-weight:700;font-size:18px}
.mcard .bd{padding:16px 18px}
.mcard ul{margin:0;padding-inline-start:18px;color:var(--ink2);font-size:14.5px}
.mcard .big{font-family:"Space Grotesk";font-size:30px;font-weight:700}
/* team */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.member{padding:16px;display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:"Space Grotesk";flex:none}
.member b{display:block;font-size:14.5px}
.member small{color:#6d6790;font-size:12.5px}
footer{background:var(--dark);color:#cfc6f6;padding:30px 0;font-size:13.5px;text-align:center}
.disclaimer{font-size:12.5px;color:#7a73a0;margin-top:10px}
@media (max-width:980px){
  .hero .wrap,.sim,.result{grid-template-columns:1fr}
  .hero h1{font-size:40px}
  .grid3,.team{grid-template-columns:1fr 1fr}
  .pipe{grid-template-columns:1fr}
  .pipe div,[dir=rtl] .pipe div,.pipe div:first-child,[dir=rtl] .pipe div:first-child{clip-path:none;border-radius:12px;margin-bottom:6px;padding:14px}
  nav .links{display:none}
  .pre{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){.grid3,.team{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

<nav><div class="wrap">
  <div class="logo"><i></i>BrainVision AI</div>
  <div class="links">
    <a href="#simulator" data-i="nav_sim"></a><a href="#architecture" data-i="nav_arch"></a><a href="#pipeline" data-i="nav_pipe"></a><a href="#team" data-i="nav_team"></a>
  </div>
  <div class="lang"><button id="bEn" class="on">EN</button><button id="bAr">العربية</button></div>
</div></nav>

<header class="hero"><div class="wrap">
  <div>
    <div class="tag" data-i="hero_tag"></div>
    <h1>BrainVision AI</h1>
    <p class="lead" data-i="hero_lead"></p>
    <div class="cta"><a class="btn primary" href="#simulator" data-i="hero_cta"></a><a class="btn ghost" href="#architecture" data-i="hero_cta2"></a></div>
    <div class="stats">
      <div class="stat"><b>7,200</b><span data-i="st1"></span></div>
      <div class="stat"><b>4</b><span data-i="st2"></span></div>
      <div class="stat"><b>2</b><span data-i="st3"></span></div>
    </div>
  </div>
  <div class="brainart"><canvas id="heroCv" width="512" height="512"></canvas><div class="scan"></div><div class="chip"><span data-i="hero_chip"></span> <b>Grad-CAM</b></div></div>
</div></header>

<section id="simulator"><div class="wrap">
  <div class="sh"><div class="tag" data-i="sim_tag"></div><h2 data-i="sim_h"></h2><p data-i="sim_p"></p></div>
  <div class="stepper" id="stepper"></div>
  <div class="sim">
    <div class="card panel">
      <h3><span class="n">1</span><span data-i="p_upload"></span></h3>
      <div class="samples" id="samples"></div>
      <div class="uploadrow">
        <label><input type="file" id="file" accept="*/*" hidden><span data-i="p_own"></span></label>
        <button id="badBtn" data-i="p_bad"></button>
      </div>
      <div class="divider"></div>
      <h3><span class="n">2</span><span data-i="p_model"></span></h3>
      <div class="models" id="models"></div>
      <div class="divider"></div>
      <div class="runrow">
        <button class="btn vio" id="runBtn" data-i="p_run"></button>
      </div>
      <div class="runrow" style="margin-top:8px">
        <button class="btn light" id="cmpBtn" disabled data-i="p_cmp"></button>
        <button class="btn danger" id="endBtn" disabled data-i="p_end"></button>
      </div>
      <p class="disclaimer" data-i="disc"></p>
    </div>
    <div class="card stage" id="stage">
      <div class="stagehead"><h3 id="stageTitle"></h3><span class="session mono" id="sessTag"></span></div>
      <div id="stageBody" style="flex:1;display:flex;flex-direction:column"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div></section>

<section id="architecture" style="background:#fff"><div class="wrap">
  <div class="sh"><div class="tag" data-i="arch_tag"></div><h2 data-i="arch_h"></h2><p data-i="arch_p"></p></div>
  <div class="card arch" id="archBox"></div>
</div></section>

<section id="pipeline"><div class="wrap">
  <div class="sh"><div class="tag" data-i="pipe_tag"></div><h2 data-i="pipe_h"></h2><p data-i="pipe_p"></p></div>
  <div class="pipe" id="pipe"></div>
  <div class="grid3">
    <div class="card mcard"><div class="hd" style="background:var(--vio)">Custom CNN</div><div class="bd"><div class="big">≈ 0.39M</div><small data-i="params"></small><ul id="m1"></ul></div></div>
    <div class="card mcard"><div class="hd" style="background:var(--org)">Xception</div><div class="bd"><div class="big">≈ 20.9M</div><small data-i="params"></small><ul id="m2"></ul></div></div>
    <div class="card mcard"><div class="hd" style="background:var(--dark)" data-i="xai_h"></div><div class="bd"><div class="big">2</div><small data-i="xai_s"></small><ul id="m3"></ul></div></div>
  </div>
</div></section>

<section id="team" style="background:#fff"><div class="wrap">
  <div class="sh"><div class="tag" data-i="team_tag"></div><h2 data-i="team_h"></h2><p data-i="team_p"></p></div>
  <div class="team" id="teamBox"></div>
</div></section>

<footer><div class="wrap"><div data-i="foot"></div></div></footer>

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}

    const d=g.getImageData(0,0,256,256).data;let mx=0,bx=.5,by=.5,sum=0;for(let y=0;y<256;y+=4)for(let x=0;x<256;x+=4){const i=(y*256+x)*4;const v=d[i]+d[i+1]+d[i+2];sum+=v;if(v>mx&&Math.hypot(x-128,y-128)<100){mx=v;bx=x/256;by=y/256}}
    pick({cls:null,seed:Math.floor(sum)%100000+7,canvas:c,focus:{x:bx,y:by,r:.1},name:t("yours")});URL.revokeObjectURL(url)};
  im.onerror=()=>pick(null,f.name);im.src=url};

/* ---------- architecture svg ---------- */
function renderArch(){
  const a=t("a");const rtl=L==="ar";const W=1100;const X=x=>rtl?W-x:x;
  const nodes=[["ui",40,40,"#5b3fb8"],["api",320,40,"#2a1f5e"],["val",600,40,"#5b3fb8"],["store",860,40,"#7c63d6"],["pre",860,200,"#5b3fb8"],["reg",600,200,"#e8691c"],["xai",320,200,"#e8691c"],["resp",40,200,"#2a1f5e"]];
  const w=200,h=86;const pos={};nodes.forEach(([k,x,y])=>pos[k]=[rtl?W-x-w:x,y]);
  const edges=[["ui","api"],["api","val"],["val","store"],["store","pre"],["pre","reg"],["reg","xai"],["xai","resp"],["resp","ui"]];
  let s=`<svg viewBox="0 0 ${W} 330" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8691c"/></marker></defs>`;
  edges.forEach(([p,q])=>{const[x1,y1]=pos[p],[x2,y2]=pos[q];let d;
    if(y1===y2){const fwd=x2>x1;d=`M${fwd?x1+w:x1} ${y1+h/2} L${fwd?x2-4:x2+w+4} ${y2+h/2}`}else{const cx=x1+w/2;d=y2>y1?`M${cx} ${y1+h} L${cx} ${y2-4}`:`M${cx} ${y1} L${cx} ${y2+h+4}`}
    s+=`<path d="${d}" stroke="#e8691c" stroke-width="2.5" fill="none" stroke-dasharray="8 4" class="pulse" marker-end="url(#ar)"/>`});
  nodes.forEach(([k,,,col])=>{const[x,y]=pos[k];s+=`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="${col}"/><text x="${x+w/2}" y="${y+38}" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Space Grotesk, IBM Plex Sans Arabic">${a[k]}</text><text x="${x+w/2}" y="${y+62}" text-anchor="middle" fill="#e4ddfb" font-size="13" font-family="IBM Plex Sans Arabic">${a[k+"s"]}</text></g>`});
  s+=`<text x="${W/2}" y="318" text-anchor="middle" fill="#6d6790" font-size="13" font-family="IBM Plex Sans Arabic">POST /api/upload  ·  POST /api/classify  ·  DELETE /api/session/{image_id}</text></svg>`;
  $("archBox").innerHTML=s;
}
const team=["Aryam Ali Al-Wadaei","Shahad Qasem Ghazwani","Nada Zafer Al-Awad","Raghad Saleh Al-Swedah","Aryam Saud Al-Qahtani","Ajwan Fayz Al-Rashah","Wessam Adel Al-Makran"];

function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";$("bEn").classList.toggle("on",l==="en");$("bAr").classList.toggle("on",l==="ar");try{localStorage.setItem("bv_lang",l)}catch(e){}
  renderStatic();renderStepper();renderSamples();renderModels();

(function hero(){const c=$("heroCv"),g=c.getContext("2d");const base=makeMRI("glioma",777,512);const hm=gradcam({cls:"glioma",seed:777,canvas:base},1,512);let a=0;
  (function loop(){a+=.02;g.drawImage(base,0,0);g.globalAlpha=.25+.3*(.5+.5*Math.sin(a));g.drawImage(hm,0,0);g.globalAlpha=1;requestAnimationFrame(loop)})()})();
